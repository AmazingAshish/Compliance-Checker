apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: compliance-checker
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/compliance_checker
  SPRING_DATASOURCE_USERNAME: compliance
  SPRING_DATASOURCE_PASSWORD: compliance
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  COMPLIANCE_UPLOAD_DIR: /data/uploads
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: compliance-checker
type: Opaque
stringData:
  # Fill this in locally (kubectl create secret / edit) - never commit a real key.
  # "unset" (not "") because Spring AI's Google GenAI auto-configuration only checks
  # the key is non-blank at startup; an empty value fails the whole app's boot instead
  # of just the LLM-review stage. See application.yml's api-key comment for details.
  GEMINI_API_KEY: "unset"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: compliance-checker
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: compliance-checker-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secret }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: compliance-checker
spec:
  selector: { app: backend }
  ports:
    - port: 8080
      targetPort: 8080
